<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu of Our Love</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .title {
            color: #e75480;
            font-size: 36px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .subtitle {
            color: #e75480;
            font-size: 18px;
            margin-top: 0;
        }
        
        .empty-heart {
            color: transparent;
            -webkit-text-stroke: 1px #e75480;
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px 1px; /* Tăng khoảng cách giữa các menu-item, 40px theo chiều dọc, 60px theo chiều ngang */
            width: 1000px; /* hoặc 100% nếu muốn full width */
            padding: 20px;
            margin: 0 auto; /* Căn giữa container theo chiều ngang */
            justify-content: center; /* Căn giữa các item trong grid */
            align-items: center; /* Căn giữa các item theo chiều dọc */
        }

        .menu-item {
            background-color: white;
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(231, 84, 128, 0.4);
            border: 2px solid #ffd1dc;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            height: 220px;
            width: 80%;
            margin: 0 auto; /* Căn giữa mỗi menu-item trong cột của nó */
        }

        .menu-item:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 20px rgba(231, 84, 128, 0.6);
        }
        
        .menu-item:hover .heart-icon {
            color: #e75480;
            -webkit-text-stroke: 0;
            transform: scale(1.3);
        }
        
        .menu-item:hover .icon-container {
            transform: scale(1.2);
        }
        
        .menu-item:hover .item-title {
            transform: scale(1.15);
        }
        
        .menu-item:hover .item-description {
            transform: scale(1.1);
        }
        
        .menu-item:hover .icon-container img {
            transform: scale(1.15);
        }

        .icon-container {
            background-color: #ffebf0;
            width: 115px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2px;
            transition: transform 0.3s ease;
        }

        .icon-container img {
            width: 80px;
            height: 75px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .item-content {
            text-align: center;
            width: 100%;
            margin-bottom: 2px;
        }

        .item-title {
            color: #e75480;
            font-size: 22px;
            margin-bottom: 2px;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .item-description {
            color: #e75480;
            font-size: 12px;
            margin-top: 0;
            margin-bottom: 2px;
            transition: transform 0.3s ease;
        }

        .heart-icon {
            color: transparent;
            font-size: 20px;
            cursor: pointer;
            -webkit-text-stroke: 1px #e75480;
            margin-top: 2px;
            transition: color 0.3s ease, -webkit-text-stroke 0.3s ease, transform 0.3s ease;
        }

        /* Responsive design */
        @media screen and (max-width: 600px) {
            body, html {
                height: auto;
                padding: 15px 0;
            }
            
            .header {
                margin-top: 10px;
                margin-bottom: 15px;
            }
            
            .menu-container {
                grid-template-columns: 1fr;
                gap: 25px; /* Giảm khoảng cách trên mobile nhưng vẫn lớn hơn ban đầu */
                padding: 10px;
                width: 95%;
            }

            .title {
                font-size: 24px;
            }

            .menu-item {
                padding: 15px;
                width: 90%;
                margin: 0 auto;
                box-shadow: 0 8px 16px rgba(231, 84, 128, 0.5);
                height: 180px;
            }

            .icon-container {
                width: 90px;
                height: 90px;
            }

            .icon-container img {
                width: 70px;
                height: 70px;
            }

            .item-title {
                font-size: 16px;
            }
        }
        
        /* Tablet devices */
        @media screen and (min-width: 601px) and (max-width: 900px) {
            .menu-container {
                width: 95%;
                gap: 30px 70px; /* Điều chỉnh khoảng cách cho tablet */
            }
            
            .menu-item {
                width: 95%;
                box-shadow: 0 8px 18px rgba(231, 84, 128, 0.45);
            }
        }
    </style>
    
</head>
<body>
    <div class="header">
        <h1 class="title">Menu of Our Love</h1>
        <p class="subtitle"><span class="empty-heart">❤</span> Together Forever <span class="empty-heart">❤</span></p>
    </div>

    <div class="menu-container">
        <div class="menu-item" onclick="location.href='./moments.html'">
            <div class="icon-container">
                <img src="./image/selecter/memories.png" alt="Memories Icon">
            </div>
            <div class="item-content">
                <h3 class="item-title">Our Memories</h3>
                <p class="item-description">Every precious moment with you ❤️</p>
            </div>
            <div class="heart-icon">❤</div>
        </div>

        <div class="menu-item" onclick="location.href='./calendar.html'">
            <div class="icon-container">
                <img src="./image/selecter/calendar.png" alt="Calendar Icon">
            </div>
            <div class="item-content">
                <h3 class="item-title">Love Calendar</h3>
                <p class="item-description">Counting days of our love story 💕</p>
            </div>
            <div class="heart-icon">❤</div>
        </div>

        <div class="menu-item" onclick="location.href='./puzzle.html'">
            <div class="icon-container">
                <img src="./image/selecter/puzzle.png" alt="Puzzle Icon">
            </div>
            <div class="item-content">
                <h3 class="item-title">Love Puzzle</h3>
                <p class="item-description">Pieces of our hearts connected 💝</p>
            </div>
            <div class="heart-icon">❤</div>
        </div>

        <div class="menu-item" onclick="location.href='./message.html'">
            <div class="icon-container">
                <img src="./image/selecter/notes.png" alt="Notes Icon">
            </div>
            <div class="item-content">
                <h3 class="item-title">Love Notes</h3>
                <p class="item-description">Sweet messages just for you 💌</p>
            </div>
            <div class="heart-icon">❤</div>
        </div>
    </div>

    <iframe src="./music.html" style="display:none;" allow="autoplay"></iframe>
</body>
</html>
