<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow-x: hidden; /* Prevent horizontal scrolling */
            overflow-y: hidden; /* Keep vertical overflow hidden */
            background-color: #fff0f3;
            width: 100%; /* Ensure body takes full width */
            position: fixed; /* Fix the body position */
            top: 0;
            left: 0;
        }
        
        .container {
            position: relative;
            text-align: center;
            z-index: 2;
            width: 90%;
            max-width: 800px;
        }
        
        .heart-image {
            max-width: 90%; /* Default size for desktop */
            height: auto;
            position: relative;
            z-index: 1;
        }
        
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            width: 100%;
            z-index: 2;
        }
        
        h1 {
            font-size: 3rem; /* Larger for desktop */
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        
        p {
            font-size: 1.2rem; /* Larger for desktop */
            margin-bottom: 20px;
        }
        
        .start-button {
            background-color: rgba(255, 255, 255, 0.8);
            color: #ff4d6d;
            border: none;
            padding: 10px 30px; /* Larger for desktop */
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .start-button:hover {
            background-color: white;
            transform: scale(1.05);
        }
        
        .falling-heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            z-index: 0;
            animation: fall linear forwards;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Tablet devices */
        @media screen and (max-width: 1024px) {
            .heart-image {
                max-width: 80%;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            p {
                font-size: 1.1rem;
            }
            
            .start-button {
                padding: 9px 28px;
                font-size: 1rem;
            }
        }
        
        /* Medium-sized devices */
        @media screen and (max-width: 768px) {
            .container {
                width: 95%;
            }
            
            .heart-image {
                max-width: 80%; /* Adjusted for tablet */
            }
            
            h1 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1rem;
                margin-bottom: 15px;
            }
            
            .start-button {
                padding: 8px 25px;
                font-size: 0.95rem;
            }
        }
        
        /* Small mobile devices */
        @media screen and (max-width: 480px) {
            .heart-image {
                max-width: 85%; /* Larger on mobile for better visibility */
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            p {
                font-size: 0.9rem;
                margin-bottom: 12px;
            }
            
            .start-button {
                padding: 7px 20px;
                font-size: 0.9rem;
                border-radius: 20px;
            }
            
            .falling-heart {
                font-size: 15px; /* Smaller hearts on mobile */
            }
        }
        
        /* Extra small devices */
        @media screen and (max-width: 360px) {
            .heart-image {
                max-width: 90%;
            }
            
            h1 {
                font-size: 1.4rem;
            }
            
            p {
                font-size: 0.8rem;
                margin-bottom: 10px;
            }
            
            .start-button {
                padding: 6px 18px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./image/timnen.png" alt="Valentine Heart" class="heart-image" id="mainHeart">
        <div class="content">
            <h1>Happy Valentine's!</h1>
            <p>Special gift for you</p>
            <button class="start-button" onclick="window.location.href='password.html'">Start!</button>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Prevent scrolling on mobile
            document.body.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            // Create falling hearts
            function createFallingHeart() {
                const heart = document.createElement('div');
                heart.innerHTML = '❤';
                heart.className = 'falling-heart';
                
                // Random position across the entire screen width
                const randomX = Math.random() * window.innerWidth;
                
                heart.style.left = randomX + 'px';
                heart.style.top = '-20px'; // Start slightly above the viewport
                
                // Random size - adjust based on screen size
                const isMobile = window.innerWidth <= 768;
                const isSmallMobile = window.innerWidth <= 480;
                
                let size;
                if (isSmallMobile) {
                    size = 8 + Math.random() * 12; // Smaller on small mobile
                } else if (isMobile) {
                    size = 10 + Math.random() * 15; // Medium on mobile
                } else {
                    size = 15 + Math.random() * 25; // Larger on desktop
                }
                
                heart.style.fontSize = size + 'px';
                
                // Random animation duration
                const duration = 3 + Math.random() * 6;
                heart.style.animationDuration = duration + 's';
                
                // Random opacity
                heart.style.opacity = 0.5 + Math.random() * 0.5;
                
                document.body.appendChild(heart);
                
                // Remove heart after animation completes
                setTimeout(() => {
                    heart.remove();
                }, duration * 1000);
            }
            
            // Create hearts at intervals - adjust based on screen size
            const isSmallMobile = window.innerWidth <= 480;
            const isMobile = window.innerWidth <= 768;
            
            let heartInterval;
            if (isSmallMobile) {
                heartInterval = 350; // Fewer hearts on small mobile
            } else if (isMobile) {
                heartInterval = 300; // More on regular mobile
            } else {
                heartInterval = 200; // Most on desktop
            }
            
            setInterval(createFallingHeart, heartInterval);
            
            // Create initial batch of hearts - adjust based on screen size
            let initialHearts;
            if (isSmallMobile) {
                initialHearts = 8;
            } else if (isMobile) {
                initialHearts = 12;
            } else {
                initialHearts = 20;
            }
            
            for (let i = 0; i < initialHearts; i++) {
                setTimeout(() => {
                    createFallingHeart();
                }, i * 100);
            }
            
            // Handle window resize
            window.addEventListener('resize', function() {
                // Could add additional responsive adjustments here if needed
            });
        });
    </script>

<iframe src="./music.html" style="display:none;" allow="autoplay"></iframe>
</body>
</html>
