<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Moments</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #fff5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-button {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
            font-weight: bold;
            color: #e75480;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background-color: #ffeef2;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(231, 84, 128, 0.4);
        }

        .slideshow-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            perspective: 1000px;
            padding: 20px 0;
            position: relative;
            margin-top: 20px;
        }

        .slide {
            width: 100%;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
            margin-bottom: 20px;
            transform: rotateY(0deg);
        }

        .slide.active {
            z-index: 10;
        }

        .slide.prev {
            transform: rotateY(-30deg) translateX(-100px) scale(0.8);
            z-index: 5;
            opacity: 0.7;
        }

        .slide.next {
            transform: rotateY(30deg) translateX(100px) scale(0.8);
            z-index: 5;
            opacity: 0.7;
        }

        .slide-content {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(231, 84, 128, 0.4);
            background-color: white;
            cursor: pointer;
        }

        .slide-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.7), transparent);
            padding: 15px;
            color: #e75480;
            font-size: 16px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        .slide-date {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }

        .heart-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #e75480;
            font-size: 24px;
            text-shadow: 0 0 3px white;
        }

        .title-container {
            text-align: center;
            margin: 60px 0 30px 0;
            background: linear-gradient(135deg, #ffffff, #ffeef2);
            padding: 20px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(231, 84, 128, 0.3);
            max-width: 80%;
            position: relative;
            border: 2px solid rgba(231, 84, 128, 0.2);
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        .title-container:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(231, 84, 128, 0.4);
        }

        .title {
            color: #e75480;
            font-size: 24px;
            margin: 0;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #888;
            font-size: 16px;
            margin: 8px 0 0;
            font-style: italic;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .nav-button {
            background-color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e75480;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(231, 84, 128, 0.3);
            transition: all 0.3s ease;
        }

        .nav-button:hover {
            background-color: #ffeef2;
            transform: scale(1.1);
        }

        .nav-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ffd1dc;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #e75480;
            transform: scale(1.2);
        }

        .corner-dog {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 80px;
            height: 80px;
            z-index: 100;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .corner-dog:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* Modal styles for image preview */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {opacity: 0}
            to {opacity: 1}
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 80%;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .modal-caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: white;
            padding: 10px 0;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(231, 84, 128, 0.7);
            border-radius: 10px;
            padding: 10px 20px;
        }

        /* Responsive design */
        @media screen and (max-width: 600px) {
            .slideshow-container {
                max-width: 90%;
            }
            
            .title-container {
                max-width: 90%;
                padding: 15px 25px;
                margin-top: 20px;
                margin-top: calc(50px + 20px); /* Nút back + 20px khoảng cách */
            }
            
            .title {
                font-size: 20px;
            }
            
            .subtitle {
                font-size: 14px;
            }

            .corner-dog {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="location.href='./selecter.html'">
        ← Back
    </button>

    <img src="./image/moments/dog.png" alt="Cute Dog" class="corner-dog">

    <div class="title-container">
        <h1 class="title">Best Moments with You</h1>
        <p class="subtitle">You're My Happy Place</p>
    </div>

    <div class="slideshow-container">
        <div class="slide active">
            <div class="slide-content">
                <img src="./image/moments/quanghan_nhuocnam (1).jpg" alt="Our First Date" class="slide-image">
                <div class="heart-icon">❤</div>
                <div class="slide-caption">
                    Our First Date
                    <div class="slide-date">31 January 2023</div>
                </div>
            </div>
        </div>
        
        <div class="slide next">
            <div class="slide-content">
                <img src="./image/moments/quanghan_nhuocnam (3).jpg" alt="Beach Day" class="slide-image">
                <div class="heart-icon">❤</div>
                <div class="slide-caption">
                    Beach Day Together
                    <div class="slide-date">15 February 2023</div>
                </div>
            </div>
        </div>
        
        <div class="slide">
            <div class="slide-content">
                <img src="./image/moments/quanghan_nhuocnam (4).jpg" alt="Movie Night" class="slide-image">
                <div class="heart-icon">❤</div>
                <div class="slide-caption">
                    Movie Night
                    <div class="slide-date">3 March 2023</div>
                </div>
            </div>
        </div>
        
        <div class="slide">
            <div class="slide-content">
                <img src="./image/moments/quanghan_nhuocnam (5).jpg" alt="Dinner Date" class="slide-image">
                <div class="heart-icon">❤</div>
                <div class="slide-caption">
                    Dinner Date
                    <div class="slide-date">20 April 2023</div>
                </div>
            </div>
        </div>
        
        <div class="slide prev">
            <div class="slide-content">
                <img src="./image/moments/quanghan_nhuocnam (6).jpg" alt="Park Picnic" class="slide-image">
                <div class="heart-icon">❤</div>
                <div class="slide-caption">
                    Park Picnic
                    <div class="slide-date">5 May 2023</div>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button class="nav-button" id="prev-btn">❮</button>
            <button class="nav-button" id="next-btn">❯</button>
        </div>
        
        <div class="nav-dots">
            <span class="dot active" data-index="0"></span>
            <span class="dot" data-index="1"></span>
            <span class="dot" data-index="2"></span>
            <span class="dot" data-index="3"></span>
            <span class="dot" data-index="4"></span>
        </div>
    </div>

    <!-- Modal for image preview -->
    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImage">
        <div id="modalCaption" class="modal-caption"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            let currentIndex = 0;
            
            function updateSlides() {
                slides.forEach((slide, index) => {
                    slide.className = 'slide';
                    if (index === currentIndex) {
                        slide.classList.add('active');
                    } else if (index === (currentIndex - 1 + slides.length) % slides.length) {
                        slide.classList.add('prev');
                    } else if (index === (currentIndex + 1) % slides.length) {
                        slide.classList.add('next');
                    }
                });
                
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentIndex);
                });
            }
            
            function goToSlide(index) {
                currentIndex = (index + slides.length) % slides.length;
                updateSlides();
            }
            
            prevBtn.addEventListener('click', () => {
                goToSlide(currentIndex - 1);
            });
            
            nextBtn.addEventListener('click', () => {
                goToSlide(currentIndex + 1);
            });
            
            dots.forEach(dot => {
                dot.addEventListener('click', () => {
                    const index = parseInt(dot.getAttribute('data-index'));
                    goToSlide(index);
                });
            });
            
            // Touch events for mobile swiping
            let touchStartX = 0;
            let touchEndX = 0;
            
            const slideContainer = document.querySelector('.slideshow-container');
            
            slideContainer.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            });
            
            slideContainer.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });
            
            function handleSwipe() {
                if (touchEndX < touchStartX - 50) {
                    // Swipe left
                    goToSlide(currentIndex + 1);
                } else if (touchEndX > touchStartX + 50) {
                    // Swipe right
                    goToSlide(currentIndex - 1);
                }
            }
            
            // Auto slide every 5 seconds
            setInterval(() => {
                goToSlide(currentIndex + 1);
            }, 5000);
            
            // Initialize
            updateSlides();

            // Image preview modal functionality
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const modalCaption = document.getElementById('modalCaption');
            const closeModal = document.querySelector('.close-modal');
            
            // Add click event to all slide contents
            document.querySelectorAll('.slide-content').forEach((slideContent, index) => {
                slideContent.addEventListener('click', function() {
                    const img = this.querySelector('.slide-image');
                    const caption = this.querySelector('.slide-caption').textContent.trim();
                    
                    modal.style.display = "block";
                    modalImg.src = img.src;
                    modalCaption.textContent = caption;
                });
            });
            
            // Close the modal
            closeModal.addEventListener('click', function() {
                modal.style.display = "none";
            });
            
            // Close modal when clicking outside the image
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = "none";
                }
            });
        });
    </script>
    
<iframe src="./music.html" style="display:none;" allow="autoplay"></iframe>
</body>
