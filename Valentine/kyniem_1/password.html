<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #fff0f3;
            overflow: hidden;
            position: fixed; /* Fix the body position */
            width: 100%; /* Ensure body takes full width */
            top: 0;
            left: 0;
        }
        
        .container {
            display: flex;
            flex-direction: row; /* Default for desktop */
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            width: 90%;
            position: relative;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        
        .photo-frame {
            border: 10px solid white;
            padding: 5px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            width: 75vw; /* 3/4 of viewport width */
            max-width: 600px;
        }
        
        .photo-frame img {
            width: 100%;
            display: block;
        }
        
        .photo-caption {
            text-align: center;
            padding: 10px 0 5px;
            font-size: 16px;
            font-weight: bold;
        }
        
        .password-container {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 75vw; /* 3/4 of viewport width */
            max-width: 600px;
        }
        
        .password-header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .password-header img {
            width: 30px;
            margin-bottom: 5px;
        }
        
        .password-header h3 {
            margin: 0;
            font-size: 16px;
            color: #333;
        }
        
        .password-header p {
            margin: 5px 0 0;
            font-size: 12px;
            color: #777;
        }
        
        .password-display {
            border: 2px solid #f7cfd9;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 5px;
            font-size: 18px;
            color: #333;
        }
        
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .key {
            background-color: #fcd9e2;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .key:hover {
            background-color: #ff6b8b;
        }
        
        .key.clear {
            background-color: #ffebee;
            color: #f44336;
            border: 1px solid #f44336;
        }
        
        .key.enter {
            background-color: #e8f5e9;
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        
        .background-heart {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
        
        .falling-heart {
            position: absolute;
            color: #ff8fab;
            font-size: 14px;
            z-index: 0;
            animation: fall linear forwards;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Popup styles */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
            max-width: 300px;
            border: 3px solid #ff8fab;
        }
        
        .popup-content {
            margin-bottom: 15px;
        }
        
        .popup-close {
            background-color: #ff8fab;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        /* Tablet devices */
        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 20px;
                width: 60%;
            }
            
            .photo-frame {
                width: 50vw;
                margin-bottom: 15px;
            }
            
            .password-container {
                width: 50vw;
            }
            
            .key {
                padding: 8px;
                font-size: 16px;
            }
        }
        
        /* Mobile devices */
        @media screen and (max-width: 480px) {
            .container {
                padding: 15px;
                width: 90%;
                gap: 10px;
            }
            
            .photo-frame {
                width: 75vw;
                border-width: 5px;
            }
            
            .photo-caption {
                font-size: 14px;
                padding: 5px 0;
            }
            
            .password-container {
                width: 75vw;
                padding: 15px;
            }
            
            .password-header h3 {
                font-size: 14px;
            }
            
            .password-header p {
                font-size: 10px;
            }
            
            .password-display {
                font-size: 16px;
                padding: 8px;
                margin-bottom: 10px;
            }
            
            .keypad {
                gap: 5px;
            }
            
            .key {
                padding: 6px;
                font-size: 14px;
            }
            
            .falling-heart {
                font-size: 12px;
            }
        }
        
        /* Small mobile devices */
        @media screen and (max-width: 380px) {
            .container {
                padding: 10px;
            }
            
            .photo-frame {
                width: 60vw;
            }
            
            .password-container {
                width: 60vw;
                padding: 10px;
            }
            
            .key {
                padding: 5px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="photo-frame">
            <img src="./image/moments/quanghan_nhuocnam (4).jpg" alt="Couple Photo">
            <div class="photo-caption" style="color: #ff69b4;">I love you so much ❤</div>
        </div>
        
        <div class="password-container">
            <div class="password-header">
                <img src="./image/password/no-password.png" alt="Lock Icon">
                <h3>Valentine's Lock</h3>
                <p>Enter the secret code</p>
            </div>
            
            <div class="password-display" id="passwordDisplay">• • • •</div>
            
            <div class="keypad">
                <div class="key" onclick="addDigit('1')">1</div>
                <div class="key" onclick="addDigit('2')">2</div>
                <div class="key" onclick="addDigit('3')">3</div>
                <div class="key" onclick="addDigit('4')">4</div>
                <div class="key" onclick="addDigit('5')">5</div>
                <div class="key" onclick="addDigit('6')">6</div>
                <div class="key" onclick="addDigit('7')">7</div>
                <div class="key" onclick="addDigit('8')">8</div>
                <div class="key" onclick="addDigit('9')">9</div>
                <div class="key clear" onclick="removeLastDigit()">X</div>
                <div class="key" onclick="addDigit('0')">0</div>
                <div class="key enter" onclick="checkPassword()">✓</div>
            </div>
        </div>
    </div>
    
    <!-- Popup for wrong password -->
    <div class="overlay" id="overlay"></div>
    <div class="popup" id="wrongPasswordPopup">
        <div class="popup-content">
            <h3>Ôi không! 😢</h3>
            <p>Mật khẩu không đúng rồi, bạn quên mất rồi huhu</p>
            <p>Hãy thử lại nhé! ❤️</p>
        </div>
        <button class="popup-close" onclick="closePopup()">Thử lại</button>
    </div>
    
    <script>
        let password = "";
        const correctPassword = "1314"; // Số bí mật để mở khóa
        const passwordDisplay = document.getElementById("passwordDisplay");
        const wrongPasswordPopup = document.getElementById("wrongPasswordPopup");
        const overlay = document.getElementById("overlay");
        
        function addDigit(digit) {
            if (password.length < 4) {
                password += digit;
                updateDisplay();
                
                // Auto-check if we have 4 digits
                if (password.length === 4) {
                    checkPassword();
                }
            }
        }
        
        function removeLastDigit() {
            if (password.length > 0) {
                password = password.slice(0, -1);
                updateDisplay();
            }
        }
        
        function clearPassword() {
            password = "";
            updateDisplay();
        }
        
        function updateDisplay() {
            let display = "";
            for (let i = 0; i < 4; i++) {
                if (i < password.length) {
                    display += password[i] + " ";
                } else {
                    display += "• ";
                }
            }
            passwordDisplay.textContent = display.trim();
        }
        
        function showPopup() {
            wrongPasswordPopup.style.display = "block";
            overlay.style.display = "block";
        }
        
        function closePopup() {
            wrongPasswordPopup.style.display = "none";
            overlay.style.display = "none";
            clearPassword();
        }
        
        function checkPassword() {
            if (password === correctPassword) {
                window.location.href = "selecter.html"; // Chuyển đến trang tiếp theo nếu đúng mật khẩu
            } else if (password.length === 4) {
                passwordDisplay.style.color = "#f44336";
                setTimeout(() => {
                    passwordDisplay.style.color = "#333";
                    showPopup(); // Hiển thị popup khi sai mật khẩu
                }, 500);
            }
        }
        
        // Add keyboard event listener
        document.addEventListener('keydown', function(event) {
            // Handle number keys (0-9)
            if (event.key >= '0' && event.key <= '9') {
                addDigit(event.key);
            } 
            // Handle backspace for removing last digit
            else if (event.key === 'Backspace') {
                removeLastDigit();
            } 
            // Handle Enter key for checking password
            else if (event.key === 'Enter') {
                checkPassword();
            }
        });
        
        // Create falling hearts background
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            
            function createHeart() {
                const heart = document.createElement('div');
                heart.className = 'falling-heart';
                heart.innerHTML = '❤';
                heart.style.position = 'absolute';
                heart.style.fontSize = Math.random() * 10 + 8 + 'px'; // Smaller hearts
                heart.style.color = '#ff8fab';
                heart.style.opacity = Math.random() * 0.3 + 0.1;
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = -20 + 'px';
                heart.style.animation = `fall ${Math.random() * 5 + 3}s linear forwards`;
                
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 8000);
            }
            
            // Create hearts at intervals
            setInterval(createHeart, 300);
            
            // Create initial batch of hearts
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    createHeart();
                }, i * 100);
            }
        });
    </script>
    
<iframe src="./music.html" style="display:none;" allow="autoplay"></iframe>
</body>
</html>
