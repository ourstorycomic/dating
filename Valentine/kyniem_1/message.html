<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin Nhắn Yêu Thương</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffcdd2, #f8bbd0);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 20px;
      padding: 8px 15px;
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #e91e63;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      z-index: 10;
    }
    
    .back-button:hover {
      background-color: rgba(255, 255, 255, 1);
      transform: translateY(-2px);
    }
    
    .envelope-container {
      width: 300px;
      height: 200px;
      position: relative;
      perspective: 1000px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    
    .envelope {
      width: 100%;
      height: 100%;
      background-color: #ff5252;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }
    
    .envelope:hover {
      transform: translateY(-10px);
    }
    
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background-color: #ff7676;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      z-index: 2;
      transition: transform 0.6s ease;
    }
    
    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
    }
    
    .envelope-content {
      position: absolute;
      top: 10px;
      left: 10px;
      width: calc(100% - 20px);
      height: calc(100% - 20px);
      background-color: white;
      background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M30,10 Q50,30 30,50 Q10,70 30,90 Q50,70 70,90 Q90,70 70,50 Q50,30 70,10 Q50,30 30,10" stroke="rgba(233, 30, 99, 0.1)" fill="none" /></svg>');
      background-size: 100px 100px;
      border-radius: 15px;
      padding: 15px;
      box-sizing: border-box;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.5s ease, opacity 0.5s ease;
      transition-delay: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .envelope.open .envelope-content {
      transform: translateY(-50px) scale(1.2);
      opacity: 1;
      z-index: 3;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .letter-content {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      text-align: center;
      transition: transform 0.5s ease;
    }
    
    .envelope.open .letter-content {
      animation: moveUpText 0.8s forwards;
    }
    
    .dog-logo {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 24px;
      opacity: 0;
      transition: opacity 0.5s ease;
      transition-delay: 0.3s;
    }
    
    .envelope.open .dog-logo {
      opacity: 1;
    }
    
    @keyframes moveUpText {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-15px);
      }
    }
    
    .heart-decoration {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff5252;
      font-size: 24px;
      z-index: 3;
    }
    
    .floating-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }
    
    .floating-heart {
      position: absolute;
      color: rgba(255, 105, 180, 0.3);
      font-size: 24px;
      animation: floatUpwards 15s linear infinite;
    }
    
    .envelope-hint {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      color: #e91e63;
      font-size: 14px;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }
    
    .envelope.open .envelope-hint {
      opacity: 0;
    }
    
    @keyframes floatUpwards {
      0% {
        transform: translateY(100%) rotate(0deg);
        opacity: 0.3;
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floating-hearts"></div>
  
  <button class="back-button" id="back-button">
    ← Back
  </button>
  
  <div class="envelope-container" id="envelope-container">
    <div class="envelope" id="envelope">
      <div class="envelope-flap"></div>
      <div class="envelope-content">
        <div class="letter-content">
          Em luôn ở trong tim anh mỗi ngày mỗi đêm. Dù có chuyện gì xảy ra, anh sẽ luôn yêu em không thay đổi. Tình yêu của anh sẽ mãi bên cạnh em. Anh muốn nói rằng anh yêu em nhiều hơn em nghĩ. Cảm ơn em đã đến với cuộc đời anh - Yêu em nhiều!
        </div>
        <div class="dog-logo">🐶</div>
      </div>
      <div class="heart-decoration">❤</div>
    </div>
    <div class="envelope-hint">Click để mở</div>
  </div>
  
  <script>
    // Create floating hearts background
    const floatingHeartsContainer = document.getElementById('floating-hearts');
    const heartSymbols = ['❤️', '💕', '💓', '💗', '💖'];
    
    for (let i = 0; i < 20; i++) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.fontSize = `${Math.random() * 20 + 10}px`;
      heart.style.animationDuration = `${Math.random() * 10 + 10}s`;
      heart.style.animationDelay = `${Math.random() * 5}s`;
      floatingHeartsContainer.appendChild(heart);
    }
    
    // Handle back button click to return to selector page
    const backButton = document.getElementById('back-button');
    backButton.addEventListener('click', () => {
      window.location.href = './selecter.html';
    });
    
    // Handle envelope click to open it
    const envelope = document.getElementById('envelope');
    const envelopeContainer = document.getElementById('envelope-container');
    
    envelopeContainer.addEventListener('click', () => {
      envelope.classList.toggle('open');
    });
  </script>
  
<iframe src="./music.html" style="display:none;" allow="autoplay"></iframe>
</body>
</html>
